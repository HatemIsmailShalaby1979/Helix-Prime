name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r release/requirements.lock.txt
          pip install -r requirements-dev.txt

      # Every directory that holds shipped Python is linted. This used to cover
      # nine paths and skip seven — including the whole app (helix_codex_app/)
      # and every test — while the build ledger claimed "ruff check clean on
      # every CI path" for thirteen. The claim is now true instead of aspirational.
      - name: Run ruff (linting)
        run: |
          ruff check \
            server/ connectors/ control_plane/ engines/ capabilities/ \
            security/ pilot/ scripts/ GOVERNANCE/ \
            contracts/ helix_codex_app/ release/ tests/ \
            memory/ metacognition/ organization/ cockpit/

      - name: Run ruff format check
        run: |
          ruff format --check .

      # contracts/ and security/ are the enforcement core's neighbours and were
      # being type-checked only by hand. organization/, cockpit/, memory/ and
      # metacognition/ are deliberately NOT here: mypy cannot resolve them as
      # packages without an __init__.py or --explicit-package-bases, so adding
      # them would fail on configuration rather than on types.
      - name: Run mypy (type checking)
        run: |
          mypy server/ connectors/ control_plane/ contracts/ security/

      - name: Run test suite
        run: |
          python -m pytest tests/ -q -m "not smoke" --cov=server --cov=connectors --cov-fail-under=80

      - name: Run security scans
        run: |
          bandit -c bandit.yaml -r server/ connectors/ control_plane/ engines/ capabilities/ security/ -ll
          pip-audit -r release/requirements.lock.txt

      - name: Check dependencies
        run: |
          python scripts/check_dependencies.py

      - name: Check migration drift (store schema vs alembic head)
        run: |
          python scripts/check_migration_drift.py

      - name: Check governance catalog drift (runtime catalog vs role-catalog.yaml)
        run: |
          python scripts/check_governance_drift.py

      - name: Check capability registry mirrors are current
        run: |
          python scripts/sync_capability_mirrors.py --check

      - name: Check governance authority (constitution + doc authority chain)
        run: |
          python GOVERNANCE/governance_check.py check

      - name: Build package
        run: |
          python -m build
