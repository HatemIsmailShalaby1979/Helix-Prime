# Helix Codex OS — Alembic configuration for the control-plane SQLite schema.
#
# The migration history lives in migrations/versions/. The initial migration
# reproduces the schema that control_plane/store.py applies, so an existing
# database is stamped rather than migrated:
#
#   alembic -x db=<path> stamp head        # existing database (no-op schema)
#   alembic -x db=<path> upgrade head      # fresh database
#
# The database path is passed per invocation via the -x db= override (no
# sqlalchemy.url is stored here: the control-plane database location is a
# deployment decision, not a repository fact). migrations/env.py resolves the
# final path: -x db > HELIX_DB_PATH env var > control_plane/workflow.db.
#
# CI enforces that the Store-created schema and the migration head produce
# identical schemas (scripts/check_migration_drift.py); the check fails when
# control_plane/store.py and migrations/versions/ disagree.

[alembic]
# %(here)s = the directory containing this file, so the script location resolves
# identically regardless of the caller's working directory.
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
