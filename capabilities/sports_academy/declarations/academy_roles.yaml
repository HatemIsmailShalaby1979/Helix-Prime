    name: Academy owner
    maps_to_agent: sami
    approval_authority: true
  - id: head_coach
    name: Head coach
    maps_to_agent: ops_gm
    approval_authority: true
  - id: coach
    name: Coach
    maps_to_agent: ops_gm
    approval_authority: false
