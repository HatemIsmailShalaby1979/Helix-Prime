# Helix Codex App — Alembic configuration for the app SQLite schema.
#
# The migration history lives in helix_codex_app/migrations/versions/. The
# baseline migration reproduces the schema that helix_codex_app/db.py applies,
# so an existing database is stamped rather than migrated:
#
#   alembic -c helix_codex_app/alembic.ini -x db=<path> stamp head
#   alembic -c helix_codex_app/alembic.ini -x db=<path> upgrade head
#
# The database path is passed per invocation via the -x db= override (no
# sqlalchemy.url is stored here: the app database location is a deployment
# decision, not a repository fact). migrations/env.py resolves the final path:
# -x db > HELIX_APP_DB_PATH env var > helix_codex_app/app.db.
#
# CI enforces that the db.py-created schema and the migration head produce
# identical schemas (helix_codex_app/scripts/check_app_migration_drift.py); the
# check fails when helix_codex_app/db.py and helix_codex_app/migrations/versions/
# disagree. The app keeps its own alembic head so the parent check
# (scripts/check_migration_drift.py) never sees app tables in its migration
# head.

[alembic]
# %(here)s = the directory containing this file, so the script location resolves
# identically regardless of the caller's working directory.
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally left blank. env.py resolves it per run.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s