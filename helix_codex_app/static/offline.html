<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e12">
  <title>Offline — Helix Codex</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-4);
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
    }
    .offline-card {
      max-width: 26rem;
      padding: var(--space-6);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-2);
    }
    .offline-mark {
      width: 40px;
      height: 40px;
      color: var(--accent);
      margin-bottom: var(--space-4);
    }
    .offline-card h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: var(--text-2xl);
      margin: 0 0 var(--space-3);
    }
    .offline-card p {
      color: var(--ink-2);
      font-size: var(--text-sm);
      line-height: 1.6;
      margin: 0 0 var(--space-3);
    }
    .offline-card p:last-child {
      margin-bottom: 0;
    }
    .offline-note {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      border-left: 3px solid var(--warn);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: var(--text-xs);
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <svg class="offline-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.4C21.3331 5.488 21.3331 7.0452 12 9.1333 2.6669 11.2213 2.6669 12.7787 12 14.8667 21.3331 16.9548 21.3331 18.512 12 20.6"/>
      <path d="M12 3.4C2.6669 5.488 2.6669 7.0452 12 9.1333 21.3331 11.2213 21.3331 12.7787 12 14.8667 2.6669 16.9548 2.6669 18.512 12 20.6"/>
    </svg>
    <h1>You are offline</h1>
    <p>The pages you have already opened are still readable from this device.</p>
    <p class="offline-note">
      New messages and edits need a connection. Nothing is queued in the
      background — when you are back online, try again and it will go through
      the same approval rail as always.
    </p>
  </main>
</body>
</html>
