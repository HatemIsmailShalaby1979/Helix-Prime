<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>Sign in — Helix Codex</title>
</head>
<body class="auth-body">
  <header class="app-header">
    <div class="app-header__inner">
      <span class="app-header__brand">Helix Codex</span>
      <span class="badge">App</span>
    </div>
  </header>
  <main class="auth-content" id="app-content">
    <section class="card auth-card">
      <h1>Sign in</h1>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/app/auth/login" class="auth-form">
        <label class="field">
          <span class="field__label">Domain</span>
          <input class="field__input" type="text" name="domain" value="{{ domain or '' }}"
                 autocomplete="username"{% if error %} aria-invalid="true"{% endif %} required>
        </label>
        <label class="field">
          <span class="field__label">Username</span>
          <input class="field__input" type="text" name="username" value="{{ username or '' }}"
                 autocomplete="username"{% if error %} aria-invalid="true"{% endif %} required>
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <input class="field__input" type="password" name="password"
                 autocomplete="current-password"{% if error %} aria-invalid="true"{% endif %} required>
        </label>
        <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <script defer src="/static/js/pwa.js"></script>
</body>
</html>
