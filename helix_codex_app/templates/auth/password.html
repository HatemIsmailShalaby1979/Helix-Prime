{% extends "auth/base_auth.html" %}
{% block title %}Set a new password — Helix Codex{% endblock %}
{% block content %}
<section class="card auth-card">
  <div>
    <h1>Set a new password</h1>
    <p class="auth-lede">
      Pick something at least eight characters long. You will use it the next
      time you sign in.
    </p>
  </div>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/app/auth/password" class="auth-form"
        hx-post="/app/auth/password"
        hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'
        hx-target="#password-fields" hx-swap="outerHTML">
    <div id="password-fields" class="auth-form">
      <label class="field">
        <span class="field__label">Current password</span>
        <input class="field__input" type="password" name="old_password"
               autocomplete="current-password" required>
      </label>
      <label class="field">
        <span class="field__label">New password</span>
        <input class="field__input" type="password" name="new_password"
               autocomplete="new-password" minlength="8" required>
        <span class="field__hint">Eight characters or more.</span>
      </label>
      <button class="btn btn--primary btn--block" type="submit">Change password</button>
    </div>
  </form>
</section>
{% endblock %}
