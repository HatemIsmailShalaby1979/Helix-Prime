<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <title>Set a new password — Helix Codex</title>
</head>
<body class="auth-body">
  <header class="app-header">
    <div class="app-header__inner">
      <span class="app-header__brand">Helix Codex</span>
      <span class="badge">App</span>
    </div>
  </header>
  <main class="auth-content" id="app-content">
    <section class="card auth-card">
      <h1>Set a new password</h1>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" action="/app/auth/password" class="auth-form"
            hx-post="/app/auth/password"
            hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'
            hx-target="#password-fields" hx-swap="outerHTML">
        <div id="password-fields">
          <label class="field">
            <span class="field__label">Current password</span>
            <input class="field__input" type="password" name="old_password"
                   autocomplete="current-password" required>
          </label>
          <label class="field">
            <span class="field__label">New password</span>
            <input class="field__input" type="password" name="new_password"
                   autocomplete="new-password" minlength="8" required>
          </label>
          <button class="btn btn--primary btn--block" type="submit">Change password</button>
        </div>
      </form>
    </section>
  </main>
  <div id="toast-host" class="toast-host" aria-live="polite"></div>
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/js/pwa.js"></script>
</body>
</html>
