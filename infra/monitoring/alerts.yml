# Helix Codex OS — Prometheus alerting and recording rules (H2.2, G22).
#
# These are CONFIG, not prose: they are loaded by a Prometheus server with
# `rule_files: infra/monitoring/alerts.yml` and evaluated against the metrics
# exposed at /metrics (see infra/monitoring/README.md for the scrape job).
#
# Metric names here must match observability/metrics.py exactly. The set of
# alert-relevant metric families is asserted by tests/test_metrics.py so the
# rules file cannot drift from the exposition.
groups:
  - name: helix_availability
    interval: 30s
    rules:
      - alert: HelixScrapeDown
        expr: up{job="helix-codex-os"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Helix Codex OS metrics endpoint is unreachable"
          description: >-
            The /metrics endpoint has been unreachable for 2 minutes. The
            service may be down or the scrape token may have rotated.

      - alert: HelixHTTP5xxRatio
        expr: >-
          sum(rate(helix_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(helix_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx error ratio"
          description: >-
            More than 5% of requests have failed with server errors for 10
            minutes.

      - alert: HelixHTTPLatencyHigh
        expr: >-
          histogram_quantile(0.95,
            sum by (le) (rate(helix_http_request_duration_seconds_bucket[10m]))
          ) > 2.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 2.5s"
          description: >-
            The 95th percentile request latency has exceeded 2.5 seconds for
            10 minutes.

  - name: helix_governance
    interval: 30s
    rules:
      - alert: HelixGovernanceDenialSpike
        expr: >-
          sum(rate(helix_governance_decisions_total{decision="denied"}[15m]))
          >
          2 * sum(rate(helix_governance_decisions_total{decision="denied"}[4h]))
          and sum(rate(helix_governance_decisions_total{decision="denied"}[4h])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Governance denial rate spiked"
          description: >-
            The 15-minute denial rate is more than double the 4-hour baseline.
            Either the policy changed unexpectedly or requests are probing the
            control plane — investigate before it becomes an incident.

      - alert: HelixAuditChainVerificationFailure
        expr: increase(helix_audit_chain_verification_failures[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit hash-chain verification failure"
          description: >-
            The tamper-evident audit chain failed verification at least once in
            the last 10 minutes. Treat as a potential integrity incident: the
            chain is forked or tampered. Run the evidence exporter and check the
            release gate before serving more traffic.

      - alert: HelixApprovalQueueBacklog
        expr: helix_approval_queue_depth > 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Approval queue depth above 20 for 30 minutes"
          description: >-
            Human approvals are the platform's rate limiter. A deep queue
            means governed work is piling up waiting for review — page the
            approval owners.

      - alert: HelixApprovalQueueStarved
        expr: helix_approval_queue_depth == 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Approval queue is empty"
          description: >-
            Informational: the governance queue is drained. Not a fault —
            recorded so an operator can distinguish "queue healthy" from
            "metrics broken".

  - name: helix_readiness
    interval: 30s
    rules:
      - alert: HelixReadinessCheckFailing
        expr: increase(helix_readiness_check_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Readiness probe failing (check: {{ $labels.check }})"
          description: >-
            /readyz reported not-ready in the last 10 minutes. Read the
            failing check from the /readyz checks object and gate traffic
            away until it passes: a live process with an unverifiable
            ledger must receive no traffic.

      - alert: HelixAuthFailureSpike
        expr: >-
          sum(rate(helix_auth_events_total{event=~"login_failure|login_throttled"}[5m])) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sign-in failure rate above 30/minute"
          description: >-
            Failed and throttled sign-ins exceed 30 per minute for 15
            minutes. Either users are struggling or credentials are being
            sprayed — check login_events for the source addresses before
            it becomes an incident.

      - alert: HelixKillSwitchEngaged
        expr: increase(helix_kill_switch_events_total{event="engaged"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Kill switch engaged"
          description: >-
            The emergency halt was engaged in the last 15 minutes. Verify
            it was an intentional operator action in the audit trail; while
            engaged, committal actions are denied by design.

  - name: helix_capacity
    interval: 30s
    rules:
      - alert: HelixDiskSpaceLow
        expr: helix_data_disk_free_bytes < 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Data volume below 1 GiB free"
          description: >-
            Less than 1 GiB remains on the volume holding the databases.
            Prune aged backups and extend the volume before SQLite starts
            failing writes.

      - alert: HelixDiskSpaceCritical
        expr: helix_data_disk_free_bytes < 268435456
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Data volume below 256 MiB free"
          description: >-
            Less than 256 MiB remains on the data volume. Writes can fail
            at any moment: stop the app cleanly, free space or extend the
            volume, then restart and verify readiness before serving.
