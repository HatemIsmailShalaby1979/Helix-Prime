server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             image/svg+xml application/xml application/rss+xml;

  # Long cache for static assets
  location ~* \.(?:css|js|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # Video + captions: cache 1 day
  location ~* \.(?:mp4|vtt)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    add_header Accept-Ranges "bytes";
    try_files $uri =404;
  }

  # Default: serve index.html, fall back to /index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Health check
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Hide hidden files (dotfiles)
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
