# Helix Codex OS — single packaging + tooling manifest.
#
# C0 collapsed five overlapping requirements manifests into requirements.txt.
# Phase 1 W1 collapses the remaining loose tool configs into this file:
#   ruff.toml   -> [tool.ruff]
#   mypy.ini    -> [tool.mypy]
#   pytest.ini  -> [tool.pytest.ini_options]
#
# `python scripts/check_dependencies.py` enforces that no dependency is
# declared outside requirements.txt / requirements-dev.txt.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-codex-os"
version = "0.9.0"
description = "Local-first collaboration and autonomous operations OS with a governed, auditable AI agent layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Runtime dependencies — mirrored verbatim from requirements.txt.
# Upper bounds on the numerical stack are HARD: pandas 3.x / numpy 2.x change
# dtype promotion, which would silently change forecast and risk numbers.
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7.0",
    "alembic>=1.13,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.12.0,<2.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "streamlit>=1.32.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "plotly>=5.18.0,<6.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "Flask>=3.0.0,<4.0.0",
    "flask-cors>=4.0.0,<7.0.0",
    "ollama>=0.4.0,<1.0.0",
]

[project.optional-dependencies]
# Mirrored from requirements-dev.txt.
dev = [
    "pytest>=7.4,<10",
    "pytest-timeout>=2.2",
    "ruff==0.1.15",
    "flake8>=6.0",
    "pre-commit>=3.5",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]

# Phase 1 W4 — the FastAPI/HTMX/SSE service spine. Python-only; no Node build step.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/HatemIsmailShalaby1979/Helix-Prime"

# Canonical entry points (S-1/G23/G24). `helix-api` is the ONE deployable
# artifact: the governed FastAPI service spine. `helix-cockpit` is the
# Streamlit dashboard — a read-only secondary surface, kept for parity with
# launch.py. desktop.py and the compose cockpit remain undocumented legacy.
[project.scripts]
helix-api = "server.cli:main"
helix-cockpit = "cockpit.cli:main"
helix-app = "helix_codex_app.cli:main"

# ---------------------------------------------------------------------------
# Build — explicit package list, NOT auto-discovery.
# Auto-discovery would swallow demo/, release/, scripts/ and tests/ into the wheel.
#
# NOTE: `server` is intentionally absent. W4 creates it; add it to this list
# in the same commit, because hatchling fails if a listed package is missing.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "capabilities",
    "cloud",
    "cockpit",
    "connectors",
    "contracts",
    "control_plane",
    "customer_success",
    "engines",
    "helix_codex_app",
    "integrations",
    "memory",
    "metacognition",
    "observability",
    "orchestration",
    "organization",
    "pilot",
    "security",
    "server",
]

[tool.hatch.build.targets.sdist]
# Must mirror the wheel package list exactly (G25): a package listed in the
# wheel but absent here makes the sdist unbuildable into that wheel.
include = [
    "/alembic.ini",
    "/app",
    "/capabilities",
    "/cloud",
    "/cockpit",
    "/connectors",
    "/contracts",
    "/control_plane",
    "/customer_success",
    "/docs",
    "/engines",
    "/helix_codex_app",
    "/infra",
    "/integrations",
    "/memory",
    "/metacognition",
    "/migrations",
    "/observability",
    "/orchestration",
    "/organization",
    "/pilot",
    "/requirements.txt",
    "/requirements-dev.txt",
    "/security",
    "/server",
]

# ---------------------------------------------------------------------------
# Ruff (was ruff.toml)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is idiomatic B008: `Depends()` in argument
# defaults is the framework's declared pattern.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# S110 (try-except-pass): best-effort wrappers where swallowing is intentional —
# connection close / ROLLBACK after a failed DB write / structured-log telemetry.
# The primary error path still raises or logs; these guards exist so a secondary
# cleanup failure cannot mask the original fault. Tracked as deferred debt; remove
# entries as each site gains explicit logging.
"control_plane/engine.py" = ["S110"]
"control_plane/store.py" = ["S110"]
"control_plane/vertical_slice/__init__.py" = ["E402", "S110"]
"security/audit.py" = ["S110"]
"engines/b2b/adapter.py" = ["S110"]
"engines/crm/adapter.py" = ["S110"]
"engines/cx/adapter.py" = ["S110"]
"engines/personnel/adapter.py" = ["S110"]
"engines/rta/adapter.py" = ["S110"]
"engines/wfm/adapter.py" = ["S110"]
# S113 (request without timeout): legacy Notion adapter — HTTP timeout work is
# tracked separately; not part of the core governed path.
"engines/b2b/notion_adapter/notion_adapter.py" = ["S113"]
# S310 (urlopen): webhook dispatcher uses a fixed HTTPS target with a 5s timeout
# (same rationale as the documented B310 bandit skip).
"engines/cx/src/alert_dispatcher.py" = ["S310"]

# --- Legacy files outside the CI ruff scan (server/ connectors/ control_plane/
# engines/ capabilities/ security/ pilot/). Not governance-core, but pre-commit
# still lints every staged file, so each documented entry keeps commits usable.
# Tracked as deferred debt; remove entries as each site is addressed.
"cloud/interfaces.py" = ["B027"]  # reset() is a deliberate non-abstract hook for local adapters
"cockpit/cli.py" = ["S603"]  # launcher execs the streamlit entry point
"cockpit/cockpit.py" = ["S310", "S311", "S603"]  # UI demo launches/util libraries
"cockpit/memory/cognitive_log.py" = ["S608"]  # legacy templated query on constant schema
"demo/synthetic_demo.py" = ["S101"]  # standalone demo uses assert checks
"desktop.py" = ["S110", "S310", "S603"]  # legacy desktop launcher
"integrations/transport.py" = ["S110"]  # best-effort sibling transport
"launch.py" = ["S310", "S603"]  # legacy launcher
"marketing/assets/build_demo.py" = ["S603"]  # demo asset builder
"memory/governed_memory.py" = ["S101"]  # precondition assert mirrors declared invariant
"observability/health.py" = ["S101", "S110", "S310"]
"release/security_gate.py" = ["S105", "S112"]  # scan fixture value + resilient collector
"release/manifest.py" = ["S603", "S607", "S110"]  # git ref collection shell-outs (fixed argv)
"helix_codex_app/scripts/check_app_migration_drift.py" = ["S110", "S603"]
"scripts/check_migration_drift.py" = ["S110", "S603"]
"scripts/pilot_dry_run.py" = ["S110"]
"scripts/smoke.py" = ["S603"]
# Tests: assert (S101) is the pytest idiom; subprocess-under-test (S603/S607),
# seeded fixture credentials (S105/S106/S107), best-effort teardown (S110), the deliberate
# broad-exception probe in C1 (B017), sys.path bootstrap imports (E402), and
# construct-and-verify locals (F841) are all conventional in tests.
"tests/*" = ["S101", "S105", "S106", "S107", "S110", "S603", "S607", "B017", "E402", "F841"]

# ---------------------------------------------------------------------------
# Mypy (was mypy.ini)
# NOTE: eight error codes are disabled here. That makes type checking largely
# cosmetic. Tightening them is tracked as Phase 1 follow-up, not silently done.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "app:engines/rta/src:engines/personnel/src:engines/b2b/src:cockpit"
explicit_package_bases = true
ignore_missing_imports = true
disable_error_code = [
    "var-annotated",
    "call-overload",
    "attr-defined",
    "assignment",
    "arg-type",
    "operator",
    "call-arg",
    "type-var",
    "dict-item",
    "union-attr",
    "truthy-function",
    "index",
    "override",
]
exclude = [
    "engines/b2b/src/main\\.py",
    "engines/personnel/src/main\\.py",
]

[tool.bandit]
skips = ["B113", "B310", "B608"]
# B113: requests without timeout — control-plane engines target internal APIs;
# failures are expected to hang, not silently drop data. A separate policy
# (connect-timeout header) is the right guard here, and that lives in connector
# contracts, not in each call site.
# B310: urllib.request.urlopen — only called with a hardcoded https URL and a
# 5-second timeout; the test fires on the bare call site, not the argument list.
# B608: hardcoded SQL expressions — queries use parameterized bindings (`?`);
# the flagged patterns are string construction for query structure, not user
# input, and table/order_by come from call sites that hardcode them.

# ---------------------------------------------------------------------------
# Pytest (was pytest.ini)
# `pythonpath = ["."]` is load-bearing: all 26 test modules rely on it.
# pytest.ini takes precedence over pyproject.toml, so pytest.ini must be
# deleted for this section to take effect.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
    "smoke: marks tests as smoke tests requiring live Ollama service",
    "unit: fast, no external dependencies",
    "integration: requires engines or Ollama",
]
testpaths = ["tests"]
addopts = "-r a --strict-markers --durations=20"
pythonpath = ["."]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
