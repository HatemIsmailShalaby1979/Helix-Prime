# Helix Prime Codex C8 — release profiles and gate boundary (YAML mirror).
#
# THIS FILE IS A MIRROR, NOT THE SOURCE OF TRUTH. It previously claimed to be
# "hand-editable source of truth; module release/profiles.py reads this file when
# present and falls back to inline defaults otherwise". That was false, and the
# correction is recorded in AGENTS.md §18.8: the gate path reads the module
# constants (`gates_required_for` -> PROFILE_REQUIRED_GATES), and
# `load_profiles()` is called only for a sanity count in
# `_gate_configuration_validation`. Editing a profile's gate list here changes
# nothing about which gates that profile requires — measured by editing it and
# watching the gate not move.
#
# So: change release/profiles.py to change behaviour, then mirror the change here.
# `tests/test_c8_release_gate.py::test_profiles_yaml_mirror` fails if the two
# disagree, including per-profile gate lists.
#
# IMPORTANT: The "production" profile adds production-only gates (signed
# production evidence, certified data isolation, external observer audit)
# that C8 does NOT satisfy. Therefore the C8 release gate can only ever emit
# CONTROLLED_PILOT_READY or PRODUCTION_CANDIDATE — never an unqualified
# PRODUCTION label.

profiles:
  - alpha
  - internal_pilot
  - controlled_pilot
  - production_candidate
  - production
  - app_pilot

gates:
  - repository_state
  - reproducible_install
  - configuration_validation
  - dependency_locking
  - startup_readiness
  - backup_restore
  - rollback
  - data_isolation
  - audit_integrity
  - security_checks
  - failure_recovery
  - performance_limits
  - operator_readiness
  - release_approval

app_gates:
  - app_auth_boundary
  - app_session_fail_closed
  - app_tenant_isolation
  - app_memory_store_isolation
  - app_migration_drift
  - app_pwa_assets

required_gates:
  alpha:
    - repository_state
  internal_pilot:
