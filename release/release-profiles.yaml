    - startup_readiness
    - data_isolation
    - audit_integrity
    - app_auth_boundary
    - app_session_fail_closed
    - app_tenant_isolation
    - app_memory_store_isolation
    - app_migration_drift
    - app_pwa_assets
  production:
    - repository_state
    - reproducible_install
