# Helix Prime Codex C8 — release profiles and gate boundary.
#
# THIS FILE IS THE SOURCE OF TRUTH. Editing it changes behaviour: every constant
# in release/profiles.py is derived from it at import, so there is no second copy
# to disagree with. Edit here, then run
# `tests/test_c8_release_gate.py`, which pins the derived values.
#
# (History, recorded in AGENTS.md §18.8: this file once called itself the source
# of truth while being only a mirror — `load_profiles()` read it for a sanity
# count and the gate path used the module's own copy, so editing a profile's gate
# list here changed nothing. That was measured by editing it and watching the
# gate not move. The header was corrected to say "mirror"; it is now true the
# other way round, because the module derives from this file.)
#
# A missing, unreadable or malformed file raises ReleaseProfilesUnavailableError
# at import — the release gate refuses to run rather than guess.
#
# `production_only_gates` is deliberately NOT a key here: it is derived as
# `required_gates.production` minus `gates`, so the two cannot drift. Adding a
# gate to `production` therefore makes it production-only automatically, which
# fails tests/test_production_evidence.py until evidence for it is defined.
#
# IMPORTANT: The "production" profile adds production-only gates (signed
# production evidence, certified data isolation, external observer audit)
# that C8 does NOT satisfy. Therefore the C8 release gate can only ever emit
# CONTROLLED_PILOT_READY or PRODUCTION_CANDIDATE — never an unqualified
# PRODUCTION label.

profiles:
  - alpha
  - internal_pilot
  - controlled_pilot
  - production_candidate
  - production
  - app_pilot

# What each gate claims to check. These comments are the ONLY statement of each
# gate's purpose — they used to live in release/profiles.py beside the literal
# list, and were silently lost when that list became derived from this file
# (AGENTS.md §18.8). They belong here, with the data, so deriving cannot drop them
# again. A gate whose purpose and behaviour disagree is the §18.2 A0.1 defect class.
gates:
  - repository_state            # the commit is attestable — NOT repo cleanliness
  - reproducible_install        # one setup path documented + dependency lock
  - configuration_validation    # config parses + validates before startup
  - dependency_locking          # dependency versions pinned/locked
  - startup_readiness           # health/readiness command passes
  - backup_restore              # backup + restore proven from synthetic data
  - rollback                    # rollback to previous manifest proven
  - data_isolation              # tenant/client isolation verified
  - audit_integrity             # audit chain verifies after backup/restore
  - security_checks             # no-secrets scan + policy checks
  - failure_recovery            # failure injection + recovery
  - performance_limits          # bounded load/soak within explicit limits
  - operator_readiness          # runbook + incident guide present
  - release_approval            # explicit human go/no-go recorded

app_gates:
  - app_auth_boundary
  - app_session_fail_closed
  - app_tenant_isolation
  - app_memory_store_isolation
  - app_migration_drift
  - app_pwa_assets

required_gates:
  alpha:
    - repository_state
  internal_pilot:
    - repository_state
    - reproducible_install
    - configuration_validation
    - startup_readiness
  controlled_pilot:
    - repository_state
    - reproducible_install
    - configuration_validation
    - dependency_locking
    - startup_readiness
    - backup_restore
    - rollback
    - data_isolation
    - audit_integrity
    - security_checks
    - failure_recovery
    - performance_limits
    - operator_readiness
    - release_approval
  production_candidate:
    - repository_state
    - reproducible_install
    - configuration_validation
    - dependency_locking
    - startup_readiness
    - backup_restore
    - rollback
    - data_isolation
    - audit_integrity
    - security_checks
    - failure_recovery
    - performance_limits
    - operator_readiness
    - release_approval
  app_pilot:
    - repository_state
    - configuration_validation
    - startup_readiness
    - data_isolation
    - audit_integrity
    - app_auth_boundary
    - app_session_fail_closed
    - app_tenant_isolation
    - app_memory_store_isolation
    - app_migration_drift
    - app_pwa_assets
  production:
    - repository_state
    - reproducible_install
    - configuration_validation
    - dependency_locking
    - startup_readiness
    - backup_restore
    - rollback
    - data_isolation
    - audit_integrity
    - security_checks
    - failure_recovery
    - performance_limits
    - operator_readiness
    - release_approval
    - signed_production_evidence
    - certified_data_isolation
    - external_observer_audit
    - production_deployment_architecture
    - disaster_recovery_evidence
    - operational_ownership
    - incident_oncall_ownership
    - security_review
    - legal_privacy_review

allowed_final:
