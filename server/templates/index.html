<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Codex OS</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body x-data="{ activeTab: 'chat' }">
    <div id="app">
        <header class="header">
            <h1>Helix Codex OS</h1>
            <nav class="nav">
                <button hx-get="/chat" hx-target="#content" :class="{ 'active': activeTab === 'chat' }" @click="activeTab = 'chat'">Chat</button>
                <button hx-get="/tasks" hx-target="#content" :class="{ 'active': activeTab === 'tasks' }" @click="activeTab = 'tasks'">Tasks</button>
                <button hx-get="/docs" hx-target="#content" :class="{ 'active': activeTab === 'docs' }" @click="activeTab = 'docs'">Docs</button>
                <button hx-get="/workflows" hx-target="#content">Workflows</button>
                <button hx-get="/approvals" hx-target="#content">Approvals</button>
            </nav>
        </header>

        <main id="content">
            <!-- Content loaded via HTMX -->
            <div class="loading">Loading...</div>
        </main>

        <footer class="footer">
            <p>Helix Codex OS v0.9.0 | Local-first operations OS</p>
        </footer>
    </div>

    <script>
        // Load initial content
        document.addEventListener('htmx:configRequest', function(evt) {
            evt.detail.headers['X-Request-ID'] = crypto.randomUUID();
        });

        // Initialize chat SSE if on chat page
        document.addEventListener('htmx:afterOnLoad', function(evt) {
            if (evt.detail.requestConfig && evt.detail.requestConfig.path === '/chat') {
                initChatSSE();
            }
        });

        function initChatSSE() {
            const evtSource = new EventSource('/api/chat/stream/default');
            evtSource.onmessage = function(event) {
                const message = JSON.parse(event.data);
                appendMessage(message);
            };
        }

        function appendMessage(message) {
            const content = document.getElementById('content');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${message.created_by}:</strong> ${message.content}`;
            content.appendChild(div);
            content.scrollTop = content.scrollHeight;
        }
    </script>
</body>
</html>
